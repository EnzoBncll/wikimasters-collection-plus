<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Brouillon · carte collée dans un album à objectif</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: oklch(0.75 0.16 293); --fg: oklch(0.975 0.006 293); --muted-fg: oklch(0.72 0.025 293);
    --card: oklch(0.225 0.022 293); --muted: oklch(0.28 0.024 293); --border: oklch(1 0 0 / 9%);
    --holo: linear-gradient(135deg, #7DD3FC, #C4B5FD, #F9A8D4, #FDE68A, #86EFAC);
    --album: #3b82f6; --rc: #ed6fa3; --ease: cubic-bezier(.2,.9,.3,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e0d14; color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100vh; min-height: 720px; overflow: hidden; background: radial-gradient(60% 50% at 50% 35%, oklch(0.32 0.12 293 / .45), transparent 70%), #0e0d14; }
  .stars { position: absolute; inset: 0; opacity: .45; background-image: radial-gradient(1.2px 1.2px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 140px 90px, #fff, transparent), radial-gradient(1.4px 1.4px at 260px 160px, #fff, transparent), radial-gradient(1px 1px at 80px 220px, #fff, transparent); background-size: 340px 300px; }
  .label { position: absolute; top: 14px; left: 18px; z-index: 30; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-fg); }
  .step { position: absolute; top: 12px; right: 18px; z-index: 30; padding: 6px 12px; border-radius: 999px; font-size: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted-fg); }
  .step b { color: var(--fg); }
  .sound { all: unset; position: absolute; top: 46px; right: 18px; z-index: 30; cursor: pointer; padding: 6px 12px; border-radius: 999px; font-size: 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted-fg); }

  .scene { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: 90px 24px 0; perspective: 1400px; }
  .side { position: relative; z-index: 1; width: 250px; margin-top: 46px; }
  .side.left { justify-self: end; margin-right: -42px; }
  .side.right { justify-self: start; margin-left: -42px; }
  .panel { border-radius: 18px; padding: 14px 10px 10px; background: color-mix(in oklch, var(--card) 72%, transparent); border: 1px solid var(--border); backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgb(0 0 0 / .35); }
  .side.left .panel { padding-right: 52px; }
  .side.right .panel { padding-left: 52px; }
  .panel h3 { margin: 0 6px 8px; font: 700 10.5px/1 'Unbounded', ui-sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-fg); }
  .item { position: relative; display: flex; align-items: center; gap: 9px; padding: 0 8px; height: 34px; border-radius: 10px; }
  .item .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .item .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .prog { font: 600 10.5px ui-monospace, monospace; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .item .bar { position: absolute; left: 26px; right: 8px; bottom: 3px; height: 2px; border-radius: 2px; background: rgb(255 255 255 / .07); overflow: hidden; }
  .item .bar i { display: block; height: 100%; width: var(--w); background: var(--c); transition: width .6s var(--ease); }
  .item.goal { transition: background .3s, box-shadow .3s; }
  .item.goal.glow { background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent), 0 0 24px color-mix(in srgb, var(--c) 45%, transparent); }
  .item.goal.glow .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent), 0 0 12px var(--c); }
  .item .bump { animation: bump .5s cubic-bezier(.2,.9,.3,1.6); color: var(--fg); }
  @keyframes bump { 40% { transform: scale(1.5); color: #fff; } }

  .center { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 16px; transform-style: preserve-3d; }
  .counter { padding: 6px 16px; border-radius: 999px; background: color-mix(in oklch, var(--card) 75%, transparent); border: 1px solid var(--border); font-size: 11px; letter-spacing: .1em; color: var(--muted-fg); text-transform: uppercase; }
  .counter b { font-size: 18px; color: var(--rc); margin: 0 4px; }
  .cardwrap { position: relative; transform-style: preserve-3d; }
  /* Option « carte qui respire » : va-et-vient doux jusqu'à 115 %, oscillation de 3° au plus (périodes décalées pour un mouvement naturel). */
  .cardwrap.breathe { animation: breathe 5.2s ease-in-out infinite, sway 7.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.15; } }
  @keyframes sway { 0%, 100% { rotate: 0deg; } 25% { rotate: -3deg; } 75% { rotate: 3deg; } }
  .card { position: relative; width: 250px; height: 356px; border-radius: 18px; overflow: hidden; background: #f4f1ea; color: #111; box-shadow: 0 0 34px color-mix(in srgb, var(--rc) 55%, transparent), 0 30px 70px rgb(0 0 0 / .55); }
  .card .img { height: 46%; background: url(https://picsum.photos/seed/louis14/500/360) center/cover; }
  .card .r { position: absolute; top: 10px; left: 10px; padding: 2px 7px; border-radius: 6px; background: var(--rc); font-weight: 800; font-size: 11px; }
  .card h4 { margin: 12px 14px 4px; font-size: 19px; }
  .card p { margin: 0 14px; font-size: 12px; color: #555; }
  .card .stats { position: absolute; bottom: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .burst { position: absolute; inset: -40px; border-radius: 30px; pointer-events: none; opacity: 0; background: radial-gradient(circle, var(--rc) 0%, transparent 62%); mix-blend-mode: screen; }
  .nav { display: flex; align-items: center; gap: 12px; }
  .nav .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); background: color-mix(in oklch, var(--card) 75%, transparent); font-size: 18px; }
  .nav .dots { display: flex; gap: 8px; } .nav .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgb(255 255 255 / .2); } .nav .dots i.on { background: var(--rc); box-shadow: 0 0 10px var(--rc); }

  /* Album 3D */
  .fly { position: absolute; inset: 0; z-index: 20; pointer-events: none; perspective: 1200px; }
  .book { position: absolute; left: 0; top: 0; width: 200px; height: 260px; transform-style: preserve-3d; opacity: 0; will-change: transform; }
  .book .back, .book .page, .book .cover, .book .cover-in { position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; backface-visibility: hidden; }
  .book .back { background: color-mix(in srgb, var(--album) 55%, #111); transform: translateZ(-14px); box-shadow: 0 30px 60px rgb(0 0 0 / .6); }
  .book .spine { position: absolute; left: -7px; top: 0; bottom: 0; width: 14px; background: color-mix(in srgb, var(--album) 60%, #000); transform: rotateY(90deg) translateZ(0); transform-origin: left; }
  .book .page { background: #f6f1e6; transform: translateZ(-6px); padding: 16px 14px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 64px; gap: 8px; border-left: 6px solid color-mix(in srgb, var(--album) 30%, #ddd); }
  .book .slot { border-radius: 6px; border: 1.5px dashed #c8bfae; display: grid; place-items: center; font: 700 10px ui-monospace, monospace; color: #b2a891; background: rgb(0 0 0 / .02); }
  .book .slot.filled { border: none; background: url(https://picsum.photos/seed/rois/120/160) center/cover; box-shadow: 0 2px 4px rgb(0 0 0 / .25); }
  .book .slot.target { border-color: var(--album); color: var(--album); animation: target 1s ease-in-out infinite; }
  @keyframes target { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--album) 30%, transparent), 0 0 18px color-mix(in srgb, var(--album) 60%, transparent); } }
  .book .slot.stuck { border: none; background: #f4f1ea; box-shadow: 0 0 0 2px var(--rc), 0 0 16px var(--rc); }
  .book .cover { transform-origin: left center; transform-style: preserve-3d; background: linear-gradient(140deg, color-mix(in srgb, var(--album) 90%, #fff), var(--album) 45%, color-mix(in srgb, var(--album) 60%, #000));
    display: flex; flex-direction: column; justify-content: space-between; padding: 18px 16px; color: #fff; box-shadow: inset 6px 0 0 rgb(0 0 0 / .18); }
  .book .cover .emoji { font-size: 36px; }
  .book .cover .t { font: 800 16px/1.15 'Unbounded', ui-sans-serif; }
  .book .cover .p { font: 700 11px ui-monospace, monospace; opacity: .85; }
  .book .cover .p b { font-size: 15px; }
  .book .cover-in { transform: rotateY(180deg); background: color-mix(in srgb, var(--album) 35%, #f6f1e6); }
  .ghost { position: absolute; left: 0; top: 0; width: 250px; height: 356px; border-radius: 18px; overflow: hidden; opacity: 0; transform-origin: top left; will-change: transform; z-index: 21;
    box-shadow: 0 0 30px color-mix(in srgb, var(--rc) 70%, transparent), 0 20px 40px rgb(0 0 0 / .5); }
  .plusone { position: absolute; left: 0; top: 0; z-index: 22; font: 800 22px 'Unbounded', ui-sans-serif; color: #fff; text-shadow: 0 0 14px var(--album), 0 2px 0 rgb(0 0 0 / .4); opacity: 0; white-space: nowrap; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 25; pointer-events: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stars"></div>
  <div class="label">Brouillon · la carte rejoint son album à objectif (boucle)</div>
  <div class="step" id="step">Étape : <b>révélé</b></div>
  <button class="sound" id="snd">🔇 Activer le son</button>
  <button class="sound" id="br" style="top:80px">🌬️ Respiration : oui</button>
  <div class="scene">
    <div class="side left"><div class="panel"><h3>Rangement</h3>
      <div class="item" style="--c:#71717a"><span class="dot"></span><span class="n">À trier</span></div>
      <div class="item" style="--c:#71717a"><span class="dot"></span><span class="n">Divers</span></div>
      <div class="item" style="--c:#71717a"><span class="dot"></span><span class="n">Doublons</span></div></div></div>
    <div class="center">
      <div class="counter">Carte <b>3</b> / 5</div>
      <div class="cardwrap" id="cardwrap">
        <div class="burst" id="burst"></div>
        <div class="card" id="card"><div class="img"></div><span class="r">SR</span><h4>Louis XIV</h4><p>roi de France et de Navarre</p><div class="stats"><span>⚔ 7 400</span><span>🛡 6 100</span></div></div>
      </div>
      <div class="nav"><div class="round">‹</div><div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i></div><div class="round">›</div></div>
    </div>
    <div class="side right"><div class="panel"><h3>Collections</h3>
      <div class="item goal" id="goalRow" style="--c:#3b82f6"><span class="dot"></span><span class="n">👑 Rois de France</span><span class="prog" id="rowProg">12/50</span><span class="bar"><i id="rowBar" style="--w:24%"></i></span></div>
      <div class="item" style="--c:#a855f7"><span class="dot"></span><span class="n">🔬 Scientifiques</span></div>
      <div class="item" style="--c:#f97316"><span class="dot"></span><span class="n">🏙️ Villes</span></div>
      <div class="item" style="--c:#ec4899"><span class="dot"></span><span class="n">🎬 Films</span></div></div></div>
  </div>
  <div class="fly" id="fly">
    <div class="book" id="book">
      <div class="back"></div>
      <div class="page" id="page"></div>
      <div class="cover" id="cover"><div class="emoji">👑</div><div class="t">Rois de France</div><div class="p">n° <b id="coverProg">12</b> / 50</div><div class="cover-in"></div></div>
    </div>
    <div class="card ghost" id="ghost"></div>
    <div class="plusone" id="plusone">+1 · 13 / 50</div>
  </div>
  <canvas id="fx"></canvas>
</div>

<script>
  // ---------- Particules (même moteur que le révélé) ----------
  const cv = document.getElementById('fx'), g = cv.getContext('2d');
  let parts = [], raf = null;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function size() { const d = devicePixelRatio || 1; cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; g.setTransform(d, 0, 0, d, 0, 0); }
  function add(p) { parts.push(p); if (!raf) raf = requestAnimationFrame(loop); }
  function sparks(x, y, color, n, speed = 9, size = 4) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = rnd(speed * .3, speed); add({ k: Math.random() < .4 ? 'star' : 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: .16, life: 1, decay: rnd(.01, .02), s: rnd(1.5, size), rot: rnd(0, 6), color: Math.random() < .3 ? '#fff' : color }); } }
  function trail(x, y, color) { add({ k: 'dot', x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-.4, .4), vy: rnd(-.6, .2), g: -.01, life: 1, decay: rnd(.02, .04), s: rnd(1, 2.6), rot: 0, color: Math.random() < .4 ? '#fff' : color }); }
  function ring(x, y, color, max, w = 5, dur = 700) { add({ k: 'ring', x, y, t0: performance.now(), dur, max, w, color, life: 1 }); }
  function star(x, y, r, rot) { g.save(); g.translate(x, y); g.rotate(rot); g.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .38 : r, a = i * Math.PI / 4; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); g.restore(); }
  function loop(now) {
    g.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      if (p.k === 'ring') { const t = (now - p.t0) / p.dur; if (t >= 1) { p.life = 0; continue; } const e = 1 - (1 - t) ** 3; g.globalAlpha = 1 - t; g.strokeStyle = p.color; g.lineWidth = p.w * (1 - t) + .5; g.beginPath(); g.arc(p.x, p.y, 8 + e * p.max, 0, 7); g.stroke(); continue; }
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .975; p.vy *= .975; p.rot += .1; p.life -= p.decay;
      g.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); g.fillStyle = p.color;
      if (p.k === 'star') star(p.x, p.y, p.s * 1.7, p.rot); else { g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill(); }
    }
    g.globalAlpha = 1; raf = parts.length ? requestAnimationFrame(loop) : null; if (!raf) g.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  }
  addEventListener('resize', size); size();

  // ---------- Sons (même famille que le révélé) ----------
  let ac = null, soundOn = false;
  document.getElementById('snd').onclick = (e) => { soundOn = !soundOn; ac ??= new AudioContext(); ac.resume(); e.target.textContent = soundOn ? '🔊 Son activé' : '🔇 Activer le son'; };
  function tone(f, t, d, type = 'sine', v = .08, f2) { if (!soundOn) return; const o = ac.createOscillator(), gg = ac.createGain(), t0 = ac.currentTime + t; o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d); gg.gain.setValueAtTime(0, t0); gg.gain.linearRampToValueAtTime(v, t0 + .015); gg.gain.exponentialRampToValueAtTime(.001, t0 + d); o.connect(gg).connect(ac.destination); o.start(t0); o.stop(t0 + d + .05); }
  function noise(t, d, v = .08, f = 1200, f2) { if (!soundOn) return; const len = ac.sampleRate * d, b = ac.createBuffer(1, len, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < len; i++) x[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), gg = ac.createGain(), t0 = ac.currentTime + t; s.buffer = b; fl.type = 'bandpass'; fl.frequency.setValueAtTime(f, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + d); gg.gain.setValueAtTime(0, t0); gg.gain.linearRampToValueAtTime(v, t0 + d * .3); gg.gain.exponentialRampToValueAtTime(.001, t0 + d); s.connect(fl).connect(gg).connect(ac.destination); s.start(t0); }
  const SFX = {
    reveal: () => { tone(110, 0, .7, 'sine', .07, 330); noise(.55, .35, .08, 3500); [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .62 + i * .055, .9, 'sine', .05)); },
    emerge: () => { noise(0, .5, .07, 500, 2600); tone(392, .1, .3, 'triangle', .05); tone(523, .2, .4, 'triangle', .05); },
    open: () => noise(0, .35, .09, 900, 300),
    fly: () => noise(0, .7, .06, 400, 4000),
    stick: () => { tone(160, 0, .3, 'sine', .3, 60); noise(0, .12, .1, 2500); [784, 988, 1175, 1568].forEach((f, i) => tone(f, .05 + i * .06, .8, 'triangle', .06)); },
    close: () => { noise(0, .25, .08, 700, 250); tone(110, .2, .2, 'sine', .15, 70); },
    home: () => { noise(0, .4, .05, 3000, 600); tone(1568, .35, .5, 'sine', .04); },
  };

  let breatheOn = true;
  const wrapEl = document.getElementById('cardwrap');
  const breathe = (on) => wrapEl.classList.toggle('breathe', on && breatheOn);
  document.getElementById('br').onclick = (e) => { breatheOn = !breatheOn; e.target.textContent = `🌬️ Respiration : ${breatheOn ? 'oui' : 'non'}`; breathe(breatheOn); };

  // ---------- Chorégraphie ----------
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), card = $('card'), book = $('book'), cover = $('cover'), ghost = $('ghost'), row = $('goalRow'), page = $('page'), plusone = $('plusone');
  const ALBUM = '#3b82f6', RC = '#ed6fa3';
  const rel = (el) => { const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height, cx: r.left - s.left + r.width / 2, cy: r.top - s.top + r.height / 2 }; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const step = (t) => ($('step').innerHTML = `Étape : <b>${t}</b>`);
  let progress = 12;

  function buildPage() {
    page.innerHTML = Array.from({ length: 9 }, (_, i) => i < 4 ? '<div class="slot filled"></div>' : i === 4 ? `<div class="slot target" id="slot">n° 13</div>` : `<div class="slot">n° ${9 + i}</div>`).join('');
  }

  async function run() {
    progress = 12; buildPage();
    $('coverProg').textContent = '12'; $('rowProg').textContent = '12/50'; $('rowBar').style.setProperty('--w', '24%');
    book.style.opacity = 0; ghost.style.opacity = 0; card.style.opacity = 1; plusone.style.opacity = 0; row.classList.remove('glow');

    // 1. Révélé (le retournement + charge SR)
    breathe(false);
    step('révélé de la carte'); SFX.reveal();
    card.animate([
      { opacity: 1, transform: 'scale(.82)', filter: `brightness(0) drop-shadow(0 0 6px ${RC})` },
      { opacity: 1, transform: 'scale(.9)', filter: `brightness(0) drop-shadow(0 0 34px ${RC})` },
    ], { duration: 700, easing: 'linear' });
    card.animate([
      { transform: 'perspective(1000px) rotateY(160deg) translateZ(80px) scale(.85)', filter: `brightness(0) drop-shadow(0 0 30px ${RC})` },
      { offset: .55, transform: 'perspective(1000px) rotateY(-14deg) translateZ(120px) scale(1.06)', filter: 'brightness(1.8)' },
      { transform: 'none', filter: 'none' },
    ], { duration: 1100, delay: 700, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' });
    await wait(1305);
    const c = rel(card); ring(c.cx, c.cy, RC, c.w, 7, 700); sparks(c.cx, c.cy, RC, 60, 10);
    $('burst').animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: .8, offset: .25 }, { opacity: 0, transform: 'scale(1.7)' }], { duration: 1300, easing: 'ease-out' });
    await wait(500);
    breathe(true);
    await wait(400);

    // 2. La ligne de l'album s'illumine, l'album en sort
    step('la carte fait partie de « Rois de France »'); row.classList.add('glow');
    const r = rel(row); sparks(r.x + 20, r.cy, ALBUM, 16, 5, 3);
    await wait(500);
    step("l'album sort de sa ligne"); SFX.emerge();
    const target = { x: c.x + c.w + 20, y: c.y + 30 };
    const from = { x: r.x - 60, y: r.cy - 130 };
    book.style.opacity = 1;
    const emerge = book.animate([
      { transform: `translate(${from.x}px, ${from.y}px) scale(.12) rotateY(-70deg) rotateX(20deg)`, opacity: 0 },
      { offset: .3, opacity: 1 },
      { transform: `translate(${target.x}px, ${target.y}px) scale(1) rotateY(-24deg) rotateX(8deg) rotateZ(-4deg)`, opacity: 1 },
    ], { duration: 800, easing: 'cubic-bezier(.2,.9,.3,1.15)', fill: 'forwards' });
    const tr = setInterval(() => { const b = rel(book); trail(b.cx, b.cy, ALBUM); }, 16);
    await emerge.finished; clearInterval(tr);
    const b0 = rel(book); ring(b0.cx, b0.cy, ALBUM, 140, 4, 600);

    // 3. L'album s'ouvre, la case attend
    step("l'album s'ouvre sur la case n° 13"); SFX.open();
    await cover.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-165deg)' }], { duration: 650, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' }).finished;

    // 4. La carte se glisse dans la case (copie qui tourne en 3D)
    step('la carte se glisse dans la case'); SFX.fly();
    ghost.innerHTML = card.innerHTML; ghost.style.opacity = 1;
    const slot = rel($('slot'));
    const c2 = rel(card), k0 = c2.w / 250, k = slot.w / 250;
    card.animate([{ opacity: 1 }, { opacity: .25 }], { duration: 400, fill: 'forwards' });
    const flight = ghost.animate([
      { transform: `translate(${c2.x}px, ${c2.y}px) rotateY(0) rotateZ(0) scale(${k0})` },
      { offset: .45, transform: `translate(${(c2.x + slot.x) / 2 + 30}px, ${Math.min(c2.y, slot.y) - 70}px) rotateY(200deg) rotateZ(-10deg) scale(${(k0 + k) / 2})` },
      { transform: `translate(${slot.x}px, ${slot.y}px) rotateY(360deg) rotateZ(0) scale(${k})` },
    ], { duration: 900, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'forwards' });
    const tr2 = setInterval(() => { const gr = rel(ghost); trail(gr.cx, gr.cy, RC); }, 16);
    await flight.finished; clearInterval(tr2);

    // 5. Collée !
    step('collée !'); SFX.stick();
    ghost.style.opacity = 0; $('slot').className = 'slot stuck'; $('slot').innerHTML = '';
    $('slot').style.background = `url(https://picsum.photos/seed/louis14/120/160) center/cover`;
    const s = rel($('slot')); ring(s.cx, s.cy, ALBUM, 90, 5, 700); ring(s.cx, s.cy, '#fff', 60, 3, 500); sparks(s.cx, s.cy, ALBUM, 40, 8, 3.5);
    book.animate([{ transform: getComputedStyle(book).transform }, { transform: getComputedStyle(book).transform + ' translateY(6px) rotateZ(1.5deg)' }, { transform: getComputedStyle(book).transform }], { duration: 260, easing: 'ease-out' });
    plusone.style.left = s.cx - 60 + 'px'; plusone.style.top = s.y - 10 + 'px';
    plusone.animate([{ opacity: 0, transform: 'translateY(10px) scale(.6)' }, { opacity: 1, transform: 'translateY(-14px) scale(1.1)', offset: .3 }, { opacity: 1, transform: 'translateY(-24px) scale(1)', offset: .75 }, { opacity: 0, transform: 'translateY(-40px)' }], { duration: 1500, easing: 'ease-out' });
    $('coverProg').textContent = '13';
    await wait(900);

    // 6. L'album se referme et rentre dans sa ligne
    step("l'album se referme et retourne dans sa ligne"); SFX.close();
    await cover.animate([{ transform: 'rotateY(-165deg)' }, { transform: 'rotateY(0deg)' }], { duration: 500, easing: 'cubic-bezier(.4,.1,.3,1)', fill: 'forwards' }).finished;
    SFX.home();
    const back = book.animate([
      { transform: getComputedStyle(book).transform, opacity: 1 },
      { transform: `translate(${from.x}px, ${from.y}px) scale(.1) rotateY(-80deg) rotateX(20deg)`, opacity: 0 },
    ], { duration: 650, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
    const tr3 = setInterval(() => { const bb = rel(book); trail(bb.cx, bb.cy, ALBUM); }, 16);
    await back.finished; clearInterval(tr3);
    sparks(r.x + 20, r.cy, ALBUM, 26, 6, 3); ring(r.x + 20, r.cy, ALBUM, 60, 4, 500);
    $('rowProg').textContent = '13/50'; $('rowProg').classList.remove('bump'); void $('rowProg').offsetWidth; $('rowProg').classList.add('bump'); $('rowBar').style.setProperty('--w', '26%');
    card.animate([{ opacity: .25 }, { opacity: 1 }], { duration: 400, fill: 'forwards' });
    await wait(700); row.classList.remove('glow');
    step('pause'); await wait(2200);
    cover.getAnimations().forEach((a) => a.cancel()); book.getAnimations().forEach((a) => a.cancel()); ghost.getAnimations().forEach((a) => a.cancel()); card.getAnimations().forEach((a) => a.cancel());
    run();
  }
  window.addEventListener('load', () => setTimeout(run, 400));
</script>
</body>
